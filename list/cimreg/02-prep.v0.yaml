# clustered resources

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cimreg-ds
  namespace: cimreg
  labels:
    app.kubernetes.io/name: cimreg
    app.kubernetes.io/component: localpv-provisioner-init
  annotations:
    description: "Prepare host path /var/lib/cimreg-local on all nodes for cimreg registry"
spec:
  # this deployment concerns pod with this label
  selector:
    matchLabels:
      app.kubernetes.io/name: cimreg
      app.kubernetes.io/component: localpv-provisioner-init
  # when creating pod, use this pod definition    
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cimreg
        app.kubernetes.io/component: localpv-provisioner-init
    spec:
      # Run on all nodes, including cplane if needed - remove this requirement if you want to run only on worker nodes
      tolerations:
        - operator: "Exists"
      # Pod exits after initContainer runs
      restartPolicy: Never
      initContainers:
        - name: create-folder
          image: busybox:1.36
          env:
            - name: CIMREG_HOSTPATH
              value: /var/lib/cimreg-local
          securityContext:
            runAsUser: 0
            # runAsNonRoot: true
          command:
            - sh
            - -c
            - |
              mkdir -p $CIMREG_HOSTPATH \
              && chmod 755 $CIMREG_HOSTPATH \
              && echo "Folder $CIMREG_HOSTPATH created on $(hostname)"
          volumeMounts:
            - name: host
              mountPath: /var/lib/cimreg-local
      containers:
        # Dummy container required, will exit immediately
        - name: pause-create-folder
          image: busybox:1.36
          command: ["true"]
          # --- THE DESTINATION ---
          volumeMounts:
            - name: node-cimreg-folder
              mountPath: /var/lib/cimreg-local
      # --- THE SOURCE ---        
      volumes:
        - name: node-cimreg-folder # a uniq name for the volume
          hostPath:
            path: /var/lib/cimreg-local
            type: DirectoryOrCreate


# 1 - initContainer runs on every node - then exits
# 2 - Main container runs true  - then immediately.
# 3 - This pod runs on every node - Any new node joining the cluster automatically runs it