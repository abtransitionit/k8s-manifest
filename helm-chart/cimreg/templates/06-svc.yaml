{{- if or .Values.enabled.all .Values.enabled.mnf.service }}
apiVersion: v1
kind: Service
metadata:
  name: cimreg-svc
  # namespace is injected by helm at install
  labels:
    app.kubernetes.io/part-of: container-image-registry
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: cimreg
    app.kubernetes.io/component: svc
    app.abtrit.io/ct: endpoint
    app.abtrit.io/rt: namespaced
  annotations:
    owner: "abtransitionit"
    description: "allows access to all pod:port behind this service"
spec:
  # yet: clusterIP, no ingress, no TLS, no auth
  type: ClusterIP            # Internal-IP only - no external access. Use type LoadBalancer or Ingress for external access.
  # this kind lookup for/apply to pod with these labels (that are created by the deployment)
  selector: 
    app.kubernetes.io/name: cimreg
    app.kubernetes.io/component: registry
  ports:
    - name: port-k8-svc       # define the service port name (used as a var)
      port: 5000              # The port the SERVICE listens on and exposes inside the cluster
      targetPort: port-ct-svc # References the container service port - the NAME in the Deployment
      protocol: TCP
{{- end }}
